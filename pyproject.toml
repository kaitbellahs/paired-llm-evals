[project]
name = "paired-llm-evals"
version = "0.1.0"
description = "Paired comparison of LLM code outputs, graded by execution, reported as rank bands."
readme = "README.md"
license = "MIT"
authors = [{ name = "Khalid Ait Bellahs" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "paired_evals"
