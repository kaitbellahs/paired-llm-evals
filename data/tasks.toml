[[task]]
id = "rle_encode"
entry = "rle_encode"
difficulty = 2
prompt = "rle_encode(s): run-length encode a string, e.g. 'aaab' -> 'a3b1'."
tests = [
  "assert rle_encode('aaab') == 'a3b1'",
  "assert rle_encode('abc') == 'a1b1c1'",
  "assert rle_encode('') == ''",
]
reference = '''
def rle_encode(s):
    out = []
    i = 0
    while i < len(s):
        j = i
        while j < len(s) and s[j] == s[i]:
            j += 1
        out.append(f"{s[i]}{j - i}")
        i = j
    return "".join(out)
'''
mutants = ['''
def rle_encode(s):
    out = []
    count = 1
    for i in range(1, len(s)):
        if s[i] == s[i - 1]:
            count += 1
        else:
            out.append(f"{s[i - 1]}{count}")
            count = 1
    return "".join(out)
''']

[[task]]
id = "valid_brackets"
entry = "valid_brackets"
difficulty = 2
prompt = "valid_brackets(s): True if every (, [ and { is closed by the matching bracket in the right order."
tests = [
  "assert valid_brackets('([]{})')",
  "assert not valid_brackets('([)]')",
  "assert not valid_brackets('((')",
  "assert valid_brackets('')",
]
reference = '''
def valid_brackets(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in s:
        if ch in "([{":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
    return not stack
'''
mutants = ['''
def valid_brackets(s):
    return all(s.count(o) == s.count(c) for o, c in ["()", "[]", "{}"])
''']

