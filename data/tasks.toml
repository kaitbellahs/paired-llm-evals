[[task]]
id = "caesar"
entry = "caesar"
difficulty = 2
prompt = "caesar(s, k): shift letters by k, wrapping around and keeping case; leave other characters alone."
tests = [
  "assert caesar('abc', 1) == 'bcd'",
  "assert caesar('xyz', 3) == 'abc'",
  "assert caesar('Hello, World', 13) == 'Uryyb, Jbeyq'",
]
reference = '''
def caesar(s, k):
    out = []
    for ch in s:
        if ch.isalpha() and ch.isascii():
            base = ord("A") if ch.isupper() else ord("a")
            out.append(chr((ord(ch) - base + k) % 26 + base))
        else:
            out.append(ch)
    return "".join(out)
'''
mutants = ['''
def caesar(s, k):
    out = []
    for ch in s:
        if ch.isalpha():
            out.append(chr((ord(ch) - ord("a") + k) % 26 + ord("a")))
        else:
            out.append(ch)
    return "".join(out)
''']

