id = "binary_search"
entry = "binary_search"
difficulty = 2
prompt = "binary_search(arr, x): index of x in the sorted list arr, or -1 if absent."
tests = [
  "assert binary_search([1, 3, 5, 7], 7) == 3",
  "assert binary_search([1, 3, 5, 7], 1) == 0",
  "assert binary_search([1, 3, 5, 7], 4) == -1",
  "assert binary_search([], 1) == -1",
]
reference = '''
def binary_search(arr, x):
    lo, hi = 0, len(arr) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if arr[mid] == x:
            return mid
        if arr[mid] < x:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1
'''
