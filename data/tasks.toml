id = "roman_to_int"
entry = "roman_to_int"
difficulty = 2
prompt = "roman_to_int(s): convert a Roman numeral to an integer, including subtractive forms like IV and CM."
tests = [
  "assert roman_to_int('III') == 3",
  "assert roman_to_int('IV') == 4",
  "assert roman_to_int('MCMXCIV') == 1994",
]
reference = '''
def roman_to_int(s):
    values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
    total = 0
    for i, ch in enumerate(s):
        v = values[ch]
        if i + 1 < len(s) and values[s[i + 1]] > v:
            total -= v
        else:
            total += v
    return total
'''
mutants = ['''
def roman_to_int(s):
    values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
    return sum(values[ch] for ch in s)
''']

