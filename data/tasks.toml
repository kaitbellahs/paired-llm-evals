# Synthetic benchmark: 24 small Python functions.
#
# Each task has a reference solution, hidden tests, and "mutants": wrong
# solutions that still look right on a read (they parse, define the function,
# and have a real body). `tests/test_dataset.py` executes all of them and
# fails if the reference does not pass or if any mutant survives the tests.
#
# difficulty: 1 easy, 2 medium, 3 hard. Used only by the simulator.

[[task]]
id = "clamp"
entry = "clamp"
difficulty = 1
prompt = "clamp(x, lo, hi): return x limited to the closed range [lo, hi]."
tests = [
  "assert clamp(5, 0, 10) == 5",
  "assert clamp(-3, 0, 10) == 0",
  "assert clamp(42, 0, 10) == 10",
  "assert clamp(0, 0, 0) == 0",
]
reference = '''
def clamp(x, lo, hi):
    return max(lo, min(x, hi))
'''
mutants = ['''
def clamp(x, lo, hi):
    return min(lo, max(x, hi))
''']

